<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SSHDock</title>
    <script>
      const savedTheme = localStorage.getItem("sshdock.theme") || "system";
      const systemTheme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.dataset.theme = savedTheme === "system" ? systemTheme : savedTheme;
    </script>
    <link rel="stylesheet" href="../../node_modules/@xterm/xterm/css/xterm.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <img class="brand-mark" src="./assets/icon.png" alt="" />
          <div>
            <h1>SSHDock</h1>
            <p data-i18n="brandSubtitle">Visual SSH client</p>
          </div>
        </div>

        <div class="sidebar-segmented">
          <button id="segConnections" type="button" class="seg-btn active">New SSH</button>
          <button id="segTerminals" type="button" class="seg-btn">Terminal</button>
        </div>
        <div id="connectionList" class="connection-list"></div>
        <button id="settingsButton" class="ghost sidebar-action" data-i18n="settings">Settings</button>
      </aside>

      <section id="workspace" class="workspace">
        <section class="config-panel">
          <div id="connectionSettings" class="settings-view hidden">
            <div class="panel-heading">
              <div>
                <h2 data-i18n="settings">Settings</h2>
                <p data-i18n="settingsSubtitle">Customize SSHDock preferences.</p>
              </div>
            </div>

            <div class="settings-form">
              <label>
                <span data-i18n="theme">Theme</span>
                <select id="themeMode">
                  <option value="system" data-i18n="themeSystem">System</option>
                  <option value="dark" data-i18n="themeDark">Dark</option>
                  <option value="light" data-i18n="themeLight">Light</option>
                </select>
              </label>
              <label>
                <span data-i18n="language">Language</span>
                <select id="languageMode">
                  <option value="system" data-i18n="languageSystem">System</option>
                  <option value="en" data-i18n="languageEnglish">English</option>
                  <option value="zh-CN" data-i18n="languageChinese">Simplified Chinese</option>
                </select>
              </label>
            </div>
          </div>

          <div id="connectionEditor">
            <div class="panel-heading">
              <div>
                <h2 id="formTitle">Connection</h2>
                <p data-i18n="passwordNote">Passwords are saved locally for future connections.</p>
              </div>
              <button id="deleteConnection" class="ghost danger" data-i18n="delete">Delete</button>
            </div>

            <form id="connectionForm" class="connection-form">
              <input id="connectionId" type="hidden" />
              <div id="connectionError" class="form-alert hidden" role="alert"></div>
              <label class="field-name">
                <span data-i18n="name">Name</span>
                <input id="name" autocomplete="off" placeholder="Production" data-i18n-placeholder="namePlaceholder" required />
              </label>
              <label class="field-host">
                <span data-i18n="host">Host</span>
                <input id="host" autocomplete="off" placeholder="192.168.1.20" data-i18n-placeholder="hostPlaceholder" required />
              </label>
              <label class="field-port">
                <span data-i18n="port">Port</span>
                <input id="port" type="number" min="1" max="65535" value="22" required />
              </label>
              <label class="field-username">
                <span data-i18n="username">Username</span>
                <input id="username" autocomplete="off" placeholder="root" data-i18n-placeholder="usernamePlaceholder" required />
              </label>

              <div class="auth-row">
                <label class="radio-card">
                  <input type="radio" name="authType" value="password" checked />
                  <span data-i18n="password">Password</span>
                </label>
                <label class="radio-card">
                  <input type="radio" name="authType" value="key" />
                  <span data-i18n="privateKey">Private key</span>
                </label>
              </div>

              <label id="keyPathRow" class="key-row hidden">
                <span data-i18n="privateKey">Private key</span>
                <div class="path-picker">
                  <input id="keyPath" autocomplete="off" placeholder="~/.ssh/id_rsa" data-i18n-placeholder="keyPathPlaceholder" />
                  <button id="chooseKey" type="button" class="secondary" data-i18n="browse">Browse</button>
                </div>
              </label>

              <label id="passwordRow">
                <span data-i18n="password">Password</span>
                <input id="password" type="password" autocomplete="current-password" placeholder="Required to connect" data-i18n-placeholder="passwordPlaceholder" />
              </label>

              <label id="passphraseRow" class="hidden">
                <span data-i18n="keyPassphrase">Key passphrase</span>
                <input id="passphrase" type="password" autocomplete="off" placeholder="Optional" data-i18n-placeholder="optionalPlaceholder" />
              </label>

              <div class="actions">
                <button id="saveConnection" type="submit" class="secondary" data-i18n="save">Save</button>
                <button id="connect" type="button" class="primary" data-i18n="connect">Connect</button>
                <button id="disconnect" type="button" class="ghost" data-i18n="disconnect">Disconnect</button>
              </div>
            </form>
          </div>
        </section>

        <section class="terminal-area">
          <section class="terminal-panel">
            <div class="terminal-toolbar">
              <div>
                <strong id="terminalTitle">Terminal</strong>
                <span id="status" class="status" data-status-key="idle">Idle</span>
              </div>
              <div class="terminal-actions">
                <button id="toggleFilePanel" type="button" class="ghost hidden" data-i18n="files">Files</button>
                <button id="popOutTerminal" type="button" class="ghost hidden" data-i18n="popOut">Pop out</button>
                <button id="toolbarDisconnect" type="button" class="ghost hidden" data-i18n="disconnect">Disconnect</button>
              </div>
            </div>
            <div id="sessionTabs" class="session-tabs hidden"></div>
            <div id="terminal"></div>
          </section>

          <aside id="filePanel" class="file-panel hidden" aria-label="Remote files">
            <div class="file-panel-toolbar">
              <button id="filePanelUp" type="button" class="ghost icon-btn" title="Up" data-i18n-title="parentDir">↑</button>
              <button id="filePanelHome" type="button" class="ghost icon-btn" title="Home" data-i18n-title="home">~</button>
              <button id="filePanelRefresh" type="button" class="ghost icon-btn" title="Refresh" data-i18n-title="refresh">⟳</button>
              <input id="filePanelPath" type="text" spellcheck="false" />
              <button id="filePanelMkdir" type="button" class="ghost icon-btn" title="New folder" data-i18n-title="newFolder">＋</button>
            </div>
            <div id="filePanelList" class="file-list"></div>
            <div id="filePanelStatus" class="file-panel-status" data-status-key="idle">Idle</div>
          </aside>
        </section>
      </section>
    </main>

    <script src="../../node_modules/@xterm/xterm/lib/xterm.js"></script>
    <script src="../../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
    <script src="../../node_modules/@xterm/addon-webgl/lib/addon-webgl.js"></script>
    <script src="./renderer.js"></script>
  </body>
</html>
