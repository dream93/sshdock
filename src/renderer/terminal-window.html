<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SSHDock Terminal</title>
    <script>
      const savedTheme = localStorage.getItem("sshdock.theme") || "system";
      const systemTheme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.dataset.theme = savedTheme === "system" ? systemTheme : savedTheme;
    </script>
    <link rel="stylesheet" href="../../node_modules/@xterm/xterm/css/xterm.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="terminal-window-body">
    <main class="detached-terminal-shell">
      <div class="detached-terminal-toolbar">
        <strong id="terminalTitle">Terminal</strong>
        <span id="status" class="status">Connected</span>
      </div>
      <div id="terminal" class="detached-terminal"></div>
    </main>

    <script src="../../node_modules/@xterm/xterm/lib/xterm.js"></script>
    <script src="../../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
    <script src="./terminal-window.js"></script>
  </body>
</html>
